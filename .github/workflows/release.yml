# Publishes a prebuilt image to GHCR on version tags and moves the major tag (v1).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/self-healing-docs:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/self-healing-docs:latest
      - name: Move major version tag
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR"
          git push -f origin "$MAJOR"
