# Dogfooding: DocHeal checks this repository's own docs on every PR.
name: DocHeal

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["**/*.py", "**/*.md"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docheal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docheal:
    if: ${{ !startsWith(github.head_ref, 'docheal/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          confidence-threshold: "0.8"
          exclude: "examples/**,benchmarks/**,tests/**"
